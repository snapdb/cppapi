name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 3 * * 2'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    # Code scanning requires GitHub Code Security for private repositories, skip until repository is public
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --assume-yes build-essential cmake libboost-all-dev zlib1g-dev libbz2-dev

    - name: Build
      run: |
        cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
        cmake --build build/ci --target snapdb samples UnitTests -j $(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
